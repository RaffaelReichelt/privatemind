  <!-- Fußzeile -->
  <line x1="60" y1="1316" x2="1260" y2="1316" stroke="#E2E7EF" stroke-width="1"/>
  <text x="60" y="1344" font-size="12" fill="#5A6472">Alle Kernkomponenten unter europäischen Open-Source-Lizenzen · Vollständig lokaler Betrieb ohne Cloud-Abhängigkeit · DSGVO-konform by design</text>
