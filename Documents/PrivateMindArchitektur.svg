  <text x="160" y="222" font-size="12" fill="#5A6472">Kernargument: Datensouveränität</text>

  <rect x="540" y="172" width="340" height="68" rx="8" fill="#FFFFFF" stroke="#C9D2E0" stroke-width="1.2"/>
