  <path d="M310,240 L460,298" stroke="#24439B" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M710,240 L662,298" stroke="#24439B" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

