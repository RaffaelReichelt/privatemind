<svg width="780" height="500" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">

  <!-- Background -->
  <rect width="780" height="500" fill="#ffffff" rx="12"/>

  <!-- Title -->
  <text x="390" y="36" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a" letter-spacing="0.3">Marktgröße — TAM · SAM · SOM</text>

  <!-- ─────────────────────────────────── -->
  <!-- Nested circles (center: 260, 258) -->
  <!-- ─────────────────────────────────── -->

  <!-- TAM — outermost ring -->
  <circle cx="258" cy="262" r="185" fill="#e8f0f7" stroke="#2980b9" stroke-width="1.5" opacity="0.6"/>

  <!-- SAM — middle ring -->
  <circle cx="258" cy="262" r="130" fill="#d0e8f0" stroke="#2980b9" stroke-width="1.5" opacity="0.75"/>

  <!-- SOM — innermost circle -->
  <circle cx="258" cy="262" r="68" fill="#1a7a3a" stroke="#27ae60" stroke-width="2" opacity="0.9"/>

  <!-- Circle labels -->
  <!-- TAM label inside outer ring -->
  <text x="258" y="104" text-anchor="middle" font-size="11" font-weight="600" fill="#2980b9">TAM</text>
  <text x="258" y="118" text-anchor="middle" font-size="10" fill="#555">EU KMU gesamt</text>

  <!-- SAM label -->
  <text x="258" y="158" text-anchor="middle" font-size="11" font-weight="600" fill="#1a5f8a">SAM</text>
  <text x="258" y="172" text-anchor="middle" font-size="10" fill="#446">Datenschutzsensibel</text>

  <!-- SOM label -->
  <text x="258" y="250" text-anchor="middle" font-size="13" font-weight="700" fill="white">SOM</text>
  <text x="258" y="267" text-anchor="middle" font-size="10" font-weight="600" fill="#a8f0c0">Ziel Jahr 3</text>

  <!-- ─────────────────────────────────── -->
  <!-- Right side: Detail cards -->
  <!-- ─────────────────────────────────── -->

  <!-- TAM Card -->
  <rect x="460" y="68" width="290" height="90" rx="8" fill="#e8f0f7" stroke="#2980b9" stroke-width="1.2"/>
  <text x="476" y="90" font-size="13" font-weight="700" fill="#2980b9">TAM — Total Addressable Market</text>
  <text x="476" y="110" font-size="11" fill="#444">EU: ~23 Mio. KMU gesamt</text>
  <text x="476" y="127" font-size="11" fill="#444">Lokale KI-Infrastruktur EU:</text>
  <text x="476" y="144" font-size="13" font-weight="700" fill="#2980b9">&gt;€5 Mrd. Marktvolumen</text>

  <!-- Connector TAM -->
  <line x1="443" y1="108" x2="458" y2="110" stroke="#2980b9" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.6"/>

  <!-- SAM Card -->
  <rect x="460" y="178" width="290" height="104" rx="8" fill="#d4eaf5" stroke="#1a5f8a" stroke-width="1.2"/>
  <text x="476" y="200" font-size="13" font-weight="700" fill="#1a5f8a">SAM — Serviceable Market</text>
  <text x="476" y="220" font-size="11" fill="#333">DACH + NL + Nordics + UK:</text>
  <text x="476" y="237" font-size="11" fill="#333">~970.000 relevante KMU</text>
  <text x="476" y="255" font-size="11" fill="#555">5-Jahres-Potenzial PrivateMind:</text>
  <text x="476" y="272" font-size="13" font-weight="700" fill="#1a5f8a">~€7,8 Mio. kumuliert</text>

  <!-- Connector SAM -->
  <line x1="388" y1="220" x2="458" y2="230" stroke="#1a5f8a" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.6"/>

  <!-- SOM Card -->
  <rect x="460" y="302" width="290" height="104" rx="8" fill="#e8f7ee" stroke="#1a7a3a" stroke-width="1.5"/>
  <text x="476" y="324" font-size="13" font-weight="700" fill="#1a7a3a">SOM — Obtainable (Jahr 3)</text>
  <text x="476" y="344" font-size="11" fill="#333">Realistisches Ziel:</text>
  <text x="476" y="361" font-size="13" font-weight="700" fill="#1a7a3a">70–150 Kunden</text>
  <text x="476" y="378" font-size="11" fill="#555">ARR: €560.000 – €1.200.000</text>
  <text x="476" y="395" font-size="11" fill="#555">Marktdurchdringung SAM: ~0,1 %</text>

  <!-- Connector SOM -->
  <line x1="326" y1="280" x2="458" y2="350" stroke="#1a7a3a" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.6"/>

  <!-- Growth note -->
  <text x="268" y="465" text-anchor="middle" font-size="11" fill="#888" font-style="italic">Wachstum EU-KI-Markt: 25–30 % CAGR — Quelle: IDC, Gartner, Eigenberechnung</text>

  <!-- Footer -->
  <text x="390" y="486" text-anchor="middle" font-size="10" fill="#bbb" font-style="italic">PrivateMind GmbH — Businessplan v2.0, Stand Juli 2026</text>

</svg>
