<svg width="750" height="560" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">

  <!-- Background -->
  <rect width="750" height="560" fill="#ffffff" rx="12"/>

  <!-- Title -->
  <text x="390" y="36" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a" letter-spacing="0.3">Die Marktlücke — Strukturell unterversorgtes KMU-Segment</text>

  <!-- Quadrant fills (axes cross at 380, 300) -->
  <!-- Top-left: TARGET ZONE — high Datenschutz, low IT-resources -->
  <rect x="110" y="80" width="270" height="220" fill="#e8f7ee" rx="6"/>
  <rect x="110" y="80" width="270" height="220" fill="none" stroke="#27ae60" stroke-width="2" stroke-dasharray="6,3" rx="6"/>
  <!-- Top-right: Enterprise zone -->
  <rect x="380" y="80" width="290" height="220" fill="#f4f4f6" rx="6"/>
  <!-- Bottom-left: Standard KMU -->
  <rect x="110" y="300" width="270" height="200" fill="#f9f9fb" rx="6"/>
  <!-- Bottom-right: Tech companies -->
  <rect x="380" y="300" width="290" height="200" fill="#f4f4f6" rx="6"/>

  <!-- Axes -->
  <line x1="110" y1="300" x2="670" y2="300" stroke="#444" stroke-width="2"/>
  <line x1="380" y1="80" x2="380" y2="500" stroke="#444" stroke-width="2"/>

  <!-- Arrowheads -->
  <polygon points="670,300 658,294 658,306" fill="#444"/>
  <polygon points="110,300 122,294 122,306" fill="#444"/>
  <polygon points="380,80 374,92 386,92" fill="#444"/>
  <polygon points="380,500 374,488 386,488" fill="#444"/>

  <!-- Axis labels -->
  <text x="678" y="300" font-size="12" font-weight="700" fill="#333" dominant-baseline="middle">HOCH</text>
  <text x="98" y="300" font-size="12" font-weight="700" fill="#333" text-anchor="end" dominant-baseline="middle">NIEDRIG</text>
  <text x="380" y="66" font-size="12" font-weight="700" fill="#333" text-anchor="middle">HOCH</text>
  <text x="380" y="517" font-size="12" font-weight="700" fill="#333" text-anchor="middle">NIEDRIG</text>

  <!-- Axis titles -->
  <text x="390" y="538" font-size="12" font-weight="600" fill="#555" text-anchor="middle">IT-Infrastruktur-Ressourcen / Interne IT-Kompetenz  →</text>
  <!-- Rotated Y-axis title -->
  <text transform="rotate(-90, 30, 290)" x="30" y="290" font-size="12" font-weight="600" fill="#555" text-anchor="middle">↑  Datenschutzbedarf / Regulierung</text>

  <!-- ─────────────────────────────────── -->
  <!-- TOP-LEFT: TARGET ZONE (PrivateMind) -->
  <!-- ─────────────────────────────────── -->

  <!-- "MARKTLÜCKE" badge -->
  <rect x="124" y="92" width="120" height="26" rx="13" fill="#1a7a3a"/>
  <text x="184" y="110" text-anchor="middle" font-size="11" font-weight="700" fill="white" letter-spacing="0.8">MARKTLÜCKE</text>

  <!-- Industry pills -->
  <!-- Row 1 -->
  <rect x="124" y="130" width="82" height="22" rx="11" fill="#2ecc71" opacity="0.25"/>
  <text x="165" y="145" text-anchor="middle" font-size="10" font-weight="600" fill="#1a7a3a">Kanzleien</text>

  <rect x="214" y="130" width="90" height="22" rx="11" fill="#2ecc71" opacity="0.25"/>
  <text x="259" y="145" text-anchor="middle" font-size="10" font-weight="600" fill="#1a7a3a">Arztpraxen</text>

  <!-- Row 2 -->
  <rect x="124" y="160" width="100" height="22" rx="11" fill="#2ecc71" opacity="0.25"/>
  <text x="174" y="175" text-anchor="middle" font-size="10" font-weight="600" fill="#1a7a3a">Steuerberater</text>

  <rect x="232" y="160" width="78" height="22" rx="11" fill="#2ecc71" opacity="0.25"/>
  <text x="271" y="175" text-anchor="middle" font-size="10" font-weight="600" fill="#1a7a3a">Notariate</text>

  <!-- Row 3 -->
  <rect x="124" y="190" width="100" height="22" rx="11" fill="#2ecc71" opacity="0.25"/>
  <text x="174" y="205" text-anchor="middle" font-size="10" font-weight="600" fill="#1a7a3a">Ingenieurbüros</text>

  <rect x="232" y="190" width="90" height="22" rx="11" fill="#2ecc71" opacity="0.25"/>
  <text x="277" y="205" text-anchor="middle" font-size="10" font-weight="600" fill="#1a7a3a">Beratungen</text>

  <!-- Barriers text -->
  <text x="130" y="232" font-size="10" fill="#b03a2e">✗  Cloud: DSGVO-Verstoß, Datenschutzrisiko</text>
  <text x="130" y="248" font-size="10" fill="#b03a2e">✗  Enterprise: zu teuer, zu komplex</text>
  <text x="130" y="264" font-size="10" fill="#b03a2e">✗  Self-hosted: IT-Expertise fehlt</text>

  <!-- PrivateMind arrow -->
  <rect x="124" y="276" width="145" height="20" rx="5" fill="#1a7a3a" opacity="0.9"/>
  <text x="197" y="290" text-anchor="middle" font-size="11" font-weight="700" fill="white">← PRIVATEMIND</text>

  <!-- ─────────────────────────────────── -->
  <!-- TOP-RIGHT: Enterprise clients -->
  <!-- ─────────────────────────────────── -->
  <text x="530" y="112" text-anchor="middle" font-size="12" font-weight="600" fill="#555">Große Unternehmen</text>
  <text x="530" y="130" text-anchor="middle" font-size="11" fill="#777">mit eigener IT-Abteilung</text>
  <text x="530" y="165" text-anchor="middle" font-size="10" fill="#888">→ Enterprise-Lösungen</text>
  <text x="530" y="181" text-anchor="middle" font-size="10" fill="#888">(SAP, IBM, Dell)</text>
  <text x="530" y="220" text-anchor="middle" font-size="10" fill="#888">→ Self-hosted Open-Source</text>

  <!-- ─────────────────────────────────── -->
  <!-- BOTTOM-LEFT: Standard KMU -->
  <!-- ─────────────────────────────────── -->
  <text x="245" y="340" text-anchor="middle" font-size="12" font-weight="600" fill="#888">Datenschutz-unempfindliche</text>
  <text x="245" y="358" text-anchor="middle" font-size="12" font-weight="600" fill="#888">KMU</text>
  <text x="245" y="390" text-anchor="middle" font-size="10" fill="#aaa">→ Standard-Cloud-Tools</text>
  <text x="245" y="406" text-anchor="middle" font-size="10" fill="#aaa">ausreichend</text>

  <!-- ─────────────────────────────────── -->
  <!-- BOTTOM-RIGHT: Tech-affine companies -->
  <!-- ─────────────────────────────────── -->
  <text x="525" y="340" text-anchor="middle" font-size="12" font-weight="600" fill="#888">Tech-affine Unternehmen</text>
  <text x="525" y="374" text-anchor="middle" font-size="10" fill="#aaa">→ Cloud-KI (OpenAI, Copilot)</text>
  <text x="525" y="390" text-anchor="middle" font-size="10" fill="#aaa">→ Self-hosted Ollama etc.</text>

  <!-- Footer -->
  <text x="390" y="556" text-anchor="middle" font-size="10" fill="#bbb" font-style="italic">PrivateMind GmbH — Businessplan v2.0, Stand Juli 2026</text>

</svg>
